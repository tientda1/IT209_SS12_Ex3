name: CD Multi-Environment

# Một workflow duy nhất lắng nghe cả hai nhánh.
# Job nào chạy được quyết định bởi điều kiện `if` theo từng nhánh.
on:
  push:
    branches:
      - develop   # -> deploy-staging
      - main      # -> deploy-prod

jobs:
  # ----- Job 1: triển khai Staging khi push vào develop -----
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://api.staging.example.com
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Triển khai lên Staging
        run: |
          echo "Deploying commit ${{ github.sha }} lên môi trường STAGING..."
          echo "URL: ${{ vars.DEPLOY_URL }}"

  # ----- Job 2: triển khai Production khi push vào main -----
  # Có Required reviewers ở environment `production` nên job sẽ TẠM DỪNG
  # ở trạng thái "Waiting for review" cho đến khi được phê duyệt.
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.prod.example.com
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Triển khai lên Production
        run: |
          echo "Deploying commit ${{ github.sha }} lên môi trường PRODUCTION..."
          echo "URL: ${{ vars.DEPLOY_URL }}"
